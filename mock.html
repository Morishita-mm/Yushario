<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Art Mock</title>
  </head>
  <body>
    <header>
      <h1>組み合わせモック</h1>
      <nav id="tabs"></nav>
      <a href="/art.html">コンポーネント一覧</a>
    </header>
    <main>
      <p id="caption"></p>
      <div class="layout">
        <div class="stage">
          <canvas id="mock"></canvas>
          <p id="messages" role="status" aria-label="メッセージ" data-en-aria-label="Message"></p>
          <div id="report" class="report-layer" hidden></div>
          <div id="toast" class="toast" role="status" hidden></div>
        </div>
        <div class="side">
          <div class="side-tabs" role="tablist" aria-label="右の列" data-en-aria-label="Sidebar">
            <button id="tab-herald" data-en="Herald" type="button" role="tab" aria-controls="herald" aria-selected="true">でんれい</button>
            <button id="tab-party" data-en="Heroes" type="button" role="tab" aria-controls="party" aria-selected="false">ゆうしゃ</button>
            <button id="tab-quests" data-en="Quests" type="button" role="tab" aria-controls="quests" aria-selected="false">クエスト</button>
          </div>
          <aside id="herald" role="tabpanel" aria-labelledby="tab-herald"></aside>
          <aside id="party" role="tabpanel" aria-labelledby="tab-party" hidden></aside>
          <aside id="quests" role="tabpanel" aria-labelledby="tab-quests" hidden></aside>
        </div>
      </div>
    </main>
    <script type="module" src="/src/web/art/mock.ts"></script>
  </body>
</html>
