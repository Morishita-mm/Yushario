<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Quest</title>
  </head>
  <body>
    <header>
      <h1>AGENT QUEST</h1>
      <span id="connection" aria-live="polite">せつぞく中…</span>
      <a id="live2d-link" href="/live2d.html">Live2D 表示</a>
      <button id="expedition" type="button">しゅつじん</button>
      <button id="roster" type="button">めいぼ</button>
      <button id="settings" type="button">せってい</button>
    </header>
    <main class="quest">
      <section class="stage">
        <nav class="map-nav" aria-label="地図の操作">
          <button id="world-back" type="button">◀ ワールドマップ</button>
          <span id="place-name">ワールドマップ</span>
          <button id="town-look" type="button" hidden>町のすがたを かえる</button>
          <button id="town-pin" type="button" aria-pressed="false" hidden>ピンどめ</button>
        </nav>
        <div id="following" class="following" role="status" hidden>
          <span id="following-name"></span>
          <button id="following-stop" type="button">やめる</button>
        </div>
        <div class="map-stage">
          <canvas id="world" role="img" aria-label="エージェントたちの町とフィールド"></canvas>
          <div id="town-layer" class="report-layer" hidden></div>
        </div>
        <p id="town-feedback" role="status" hidden></p>
        <div id="messages" class="window messages" aria-live="polite"></div>
      </section>
      <div class="sidebar">
        <aside id="herald" aria-label="でんれい"></aside>
        <div class="status-size" role="group" aria-label="つよさの 表示">
          <button type="button" data-status-size="small" aria-pressed="false">ちいさく</button>
          <span aria-hidden="true">/</span>
          <button type="button" data-status-size="detailed" aria-pressed="true">くわしく</button>
        </div>
        <aside id="party" aria-label="ゆうしゃたちの つよさ"></aside>
      </div>
    </main>
    <dialog id="expedition-dialog" class="report-window expedition-window" aria-labelledby="expedition-title">
      <h3 id="expedition-title">しゅつじん</h3>
      <form id="expedition-form">
        <label for="expedition-preset">勇者の種類</label>
        <select id="expedition-preset">
          <option value="claude">Claude Code</option>
          <option value="codex">Codex</option>
          <option value="pi">pi</option>
          <option value="shell">shell</option>
        </select>
        <label for="expedition-destination">行き先（作業ディレクトリ）</label>
        <select id="expedition-destination"><option value="">ほかの フォルダ</option></select>
        <label id="expedition-path-label" for="expedition-path">絶対パス</label>
        <input id="expedition-path" type="text" placeholder="/absolute/path/to/project" required />
        <button id="expedition-start" type="submit">▶ しゅつじん！</button>
      </form>
      <p id="expedition-status" class="settings-status" role="status"></p>
      <h4>ひらいている ターミナル</h4>
      <div id="expedition-sessions" class="town-list"></div>
      <div class="actions"><button id="expedition-close" type="button">▶ とじる</button></div>
    </dialog>
    <dialog id="roster-dialog" class="report-window" aria-labelledby="roster-title">
      <h3 id="roster-title">ぼうけんしゃの めいぼ</h3>
      <p id="roster-status" class="settings-status" role="status"></p>
      <div id="roster-list" class="town-list"></div>
      <div class="actions"><button id="roster-close" type="button">▶ とじる</button></div>
    </dialog>
    <dialog id="session-dialog" class="report-window terminal-window" aria-labelledby="session-title">
      <div class="terminal-heading">
        <h3 id="session-title">ターミナル</h3>
        <button id="session-talk" class="switch-view" type="button" hidden>▶ はなす</button>
        <button id="session-close" type="button">▶ とじる</button>
      </div>
      <p id="session-status" role="status"></p>
      <div id="session-terminal" aria-label="勇者のターミナル"></div>
      <p class="terminal-hint">Esc・窓の外・とじる で 町にもどる。勇者は うごきつづけます。</p>
    </dialog>
    <dialog id="talk-dialog" class="report-window talk-window" aria-labelledby="talk-title">
      <div class="talk-heading">
        <h3 id="talk-title">会話と報告</h3>
        <button id="talk-terminal" class="switch-view" type="button">▶ ターミナル</button>
        <button id="talk-close" type="button">▶ とじる</button>
      </div>
      <div id="talk-history" aria-label="勇者との会話と報告" tabindex="0"></div>
      <div class="talk-pages"><button id="talk-next" type="button" hidden>▼ すべて みる</button></div>
      <div id="talk-pending" aria-live="polite" hidden></div>
      <form id="talk-form" class="answer">
        <label for="talk-input">勇者に つたえる</label>
        <textarea id="talk-input" rows="2" maxlength="8000" required placeholder="いらいを かく（Ctrl+Enter でも つたえる）"></textarea>
        <button id="talk-send" type="submit">▶ つたえる</button>
      </form>
      <p id="talk-foreign" class="hint" hidden>外から来た勇者なので 読むだけです。このアプリの ターミナルでは ないため、ここからは つたえられません。</p>
      <p id="talk-status" role="status"></p>
    </dialog>
    <dialog id="strength-dialog" class="report-window strength-window" aria-labelledby="strength-title">
      <div class="strength-heading">
        <h3 id="strength-title">つよさ</h3>
        <button id="strength-close" type="button">▶ とじる</button>
      </div>
      <div class="name-controls">
        <button id="strength-rename" type="button">▶ なまえを かえる</button>
        <form id="name-form" hidden>
          <label for="hero-name">なまえ（1〜24文字・空で じどうの なまえ）</label>
          <input id="hero-name" type="text" maxlength="24" autocomplete="off" />
          <button id="name-save" type="submit">▶ ほぞん</button>
          <button id="name-cancel" type="button">やめる</button>
        </form>
        <p id="name-status" role="status"></p>
      </div>
      <div id="strength-content" aria-label="勇者の つよさ" tabindex="0"></div>
      <p class="terminal-hint">Esc・窓の外・とじる で 町にもどる。</p>
    </dialog>
    <script type="module" src="/src/web/rpg/main.ts"></script>
  </body>
</html>
