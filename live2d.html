<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Character</title>
  </head>
  <body>
    <header>
      <h1>Agent Character</h1>
      <label for="preset">プリセット</label>
      <select id="preset">
        <option value="shell">shell</option>
        <option value="claude">Claude Code</option>
        <option value="pi">pi</option>
        <option value="codex">Codex</option>
      </select>
      <label for="cwd">作業ディレクトリ</label>
      <input id="cwd" type="text" placeholder="空欄で既定・指定は絶対パス" aria-label="作業ディレクトリ（絶対パス）" />
      <button id="start" type="button">起動</button>
      <label for="sessions">セッション</label>
      <select id="sessions"><option value="">セッションを選択</option></select>
      <button id="connect-session" type="button" disabled>接続</button>
      <button id="end-session" type="button" disabled>終了</button>
      <button id="refresh-sessions" type="button">一覧を更新</button>
      <span id="terminal-status" aria-live="polite">未起動</span>
    </header>
    <main>
      <section id="character-panel" aria-label="キャラクター">
        <div id="character-view">
          <canvas id="character" width="640" height="640" role="img" aria-label="エージェントの表情と姿勢"></canvas>
        </div>
        <aside id="status" aria-live="polite">
          <span id="state">idle</span>
          <span id="connection">接続中…</span>
          <span id="renderer-status">Live2D 読込中…</span>
        </aside>
      </section>
      <section id="terminal-panel" aria-label="エージェントのターミナル">
        <div id="terminal"></div>
      </section>
    </main>
    <script src="/live2dcubismcore.min.js"></script>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
