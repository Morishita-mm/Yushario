<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Terminal</title>
  </head>
  <body>
    <header>
      <h1 data-en="Terminal">ターミナル</h1>
      <a id="town-link" data-en="◀ Back to town" href="/">◀ 町へ もどる</a>
      <label for="preset" data-en="Preset">プリセット</label>
      <select id="preset"></select>
      <label for="cwd" data-en="Working folder">作業フォルダ</label>
      <input id="cwd" type="text" placeholder="/absolute/path/to/project" aria-label="作業フォルダ（絶対パス）" data-en-aria-label="Working folder (absolute path)" />
      <button id="start" data-en="Start" type="button" disabled>起動</button>
      <label for="sessions" data-en="Session">セッション</label>
      <select id="sessions"><option value="" data-en="Select a session">セッションを選択</option></select>
      <button id="connect-session" data-en="Connect" type="button" disabled>接続</button>
      <button id="end-session" data-en="End" type="button" disabled>終了</button>
      <button id="refresh-sessions" data-en="Refresh" type="button">一覧を更新</button>
      <span id="terminal-status" data-en="Not started" aria-live="polite">未起動</span>
    </header>
    <main>
      <section id="terminal-panel" aria-label="エージェントのターミナル" data-en-aria-label="Agent terminal">
        <div id="terminal"></div>
      </section>
    </main>
    <script type="module" src="/src/web/terminal-page.ts"></script>
  </body>
</html>
